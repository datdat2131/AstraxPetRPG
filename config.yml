settings:
  xp-per-monster-kill: 10
  souls-per-kill: 5
  starting-souls: 100
  skill-cooldown-seconds: 8
  follow-distance: 3.0
  teleport-distance: 14.0
  skill-range: 8.0
  base-skill-damage: 3.0
  damage-per-level: 0.35
  autosave-minutes: 5
  auto-respawn: true
  auto-summon-on-join: false
  max-active-pets-per-player: 1
  combat-tick-interval: 20
  max-targets-per-tick: 12

auto-skill:
  enabled: true
  interval-seconds: 4
  damage-multiplier: 0.4

passive:
  enabled: true
  health-per-level: 0.05
  max-health-bonus: 20.0
  speed-per-level: 0.001
  damage-per-level: 0.02
  max-damage-bonus: 6.0

gacha:
  cost-souls: 100
  duplicate-xp: 150
  broadcast-rare: true
  pity-epic: 30
  egg-hatch-seconds: 3
  weights:
    common: 5200
    uncommon: 2600
    rare: 1300
    epic: 600
    legendary: 250
    mythic: 45
    ancient: 5

storage:
  type: sqlite
  sqlite-file: pets.db
  # MySQL chưa bật trong bản này; SQLite là backend được hỗ trợ mặc định.
  mysql:
    host: localhost
    port: 3306
    database: astraxpets
    username: astrax
    password: change-me

evolution:
  stage-levels: [25, 50, 75]
  branches:
    WOLF: [SHADOW_WOLF, CELESTIAL_WOLF]
    FOX: [INFERNO_FOX, SPIRIT_FOX]

integrations:
  mythicmobs: true
  mythiclib: true
  placeholderapi: true
