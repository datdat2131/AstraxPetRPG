name: AstraxPetRPG
version: 2.0.0
main: vn.soulpets.SoulPetsPlugin
api-version: '1.21'
description: Pet RPG cho Paper 1.21.4 - bộ sưu tập, gacha, EXP và chiến đấu.
softdepend: [MythicMobs, MythicLib, PlaceholderAPI]
commands:
  pet:
    description: Quản lý pet RPG.
    usage: /pet <menu|summon|dismiss|stats|skill|evolve|equip|petdex|egg|gacha|select|rename|top|help>
    permission: soulpets.use
  petadmin:
    description: Quản trị Astrax Pet RPG.
    usage: /petadmin <give|xp|souls|reload>
    permission: soulpets.admin
permissions:
  soulpets.use:
    default: true
  soulpets.admin:
    default: op
